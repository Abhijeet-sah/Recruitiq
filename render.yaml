services:
  # 1. FastAPI Backend API
  - type: web
    name: recruitiq-backend
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: recruitiq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: local
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true

  # 2. React + Vite Frontend Web App
  - type: web
    name: recruitiq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://recruitiq-backend.onrender.com
    autoDeploy: true

databases:
  # 3. PostgreSQL Database
  - name: recruitiq-db
    databaseName: recruitiq
    user: recruitiq
    plan: free
